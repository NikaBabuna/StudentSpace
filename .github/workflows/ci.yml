name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint is a hard gate: the codebase is at 0 errors / 0 warnings.
      - name: Lint
        run: npm run lint

      # Runs the unit suite AND enforces the coverage thresholds on pure
      # domain modules (vitest.config.ts) — dropping coverage fails CI.
      - name: Test (with coverage gate)
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          # NEXT_PUBLIC_* vars are inlined at build time. The build does not
          # connect to Supabase (all data routes are dynamic), so placeholders
          # are sufficient for CI. Set real values as repo secrets to mirror
          # production exactly.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
